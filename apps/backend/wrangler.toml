name = "impact-circle-api"
main = "src/worker.ts"
compatibility_date = "2024-04-01"
compatibility_flags = [ "nodejs_compat" ]

[vars]
# These are managed via Cloudflare Dashboard or 'wrangler secret put'
# FRONTEND_URL = ""
# BETTER_AUTH_URL = ""

# These should be set via 'wrangler secret put' in production
# DATABASE_URL = ""
# BETTER_AUTH_SECRET = ""
# GOOGLE_CLIENT_ID = ""
# GOOGLE_CLIENT_SECRET = ""

[observability]
enabled = true
